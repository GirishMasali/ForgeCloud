# ==============================================================================
# ForgeCloud Alembic Configuration
# Database schema migrations for PostgreSQL (Production) & SQLite (Testing)
# ==============================================================================

[alembic]
# Path to migration scripts
script_location = database/alembic

# Template used to generate migration file names
file_template = %%(rev)s_%%(slug)s

# Sys.path configuration to locate backend package
prepend_sys_path = .
path_separator = os

# Timezone for generated migration timestamps
timezone = UTC

# Logging configuration
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
