# ==============================================================================
# ForgeCloud Unified Local Development Docker Compose Stack
# Orchestrates: PostgreSQL 15, FastAPI Control Plane, React Frontend, Sample App
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # 1. PostgreSQL Relational Database Service
  # ----------------------------------------------------------------------------
  postgres:
    image: postgres:15-alpine
    container_name: forgecloud-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-forgecloud_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-forgecloud_password}
      POSTGRES_DB: ${POSTGRES_DB:-forgecloud_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-forgecloud_user} -d ${POSTGRES_DB:-forgecloud_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - forgecloud-network

  # ----------------------------------------------------------------------------
  # 2. FastAPI Control Plane Backend Service
  # ----------------------------------------------------------------------------
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: forgecloud-backend
    restart: unless-stopped
    environment:
      ENVIRONMENT: development
      LOG_LEVEL: info
      FORGECLOUD_LOCAL_MODE: "true"
      DATABASE_URL: postgresql://${POSTGRES_USER:-forgecloud_user}:${POSTGRES_PASSWORD:-forgecloud_password}@postgres:5432/${POSTGRES_DB:-forgecloud_db}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-forgecloud_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-forgecloud_password}
      POSTGRES_DB: ${POSTGRES_DB:-forgecloud_db}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-forgecloud-local-dev-secret-key-32-chars-min}
      JWT_ALGORITHM: HS256
      JWT_ACCESS_TOKEN_EXPIRE_MINUTES: 60
      CORS_ORIGINS: '["http://localhost:5173", "http://127.0.0.1:5173", "http://localhost", "http://frontend", "http://backend:8000"]'
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - forgecloud-network

  # ----------------------------------------------------------------------------
  # 3. React Single Page Application Frontend Service (Nginx)
  # ----------------------------------------------------------------------------
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: forgecloud-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - forgecloud-network

  # ----------------------------------------------------------------------------
  # 4. ForgeCloud Sample Application Microservice
  # ----------------------------------------------------------------------------
  sample-app:
    build:
      context: .
      dockerfile: sample-app/Dockerfile
    container_name: forgecloud-sample-app
    restart: unless-stopped
    environment:
      SERVICE_NAME: sample-backend-service
      SERVICE_VERSION: v1.0.0
      ENVIRONMENT: development
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - forgecloud-network

# ------------------------------------------------------------------------------
# Persistent Volumes
# ------------------------------------------------------------------------------
volumes:
  postgres_data:
    name: forgecloud_postgres_data

# ------------------------------------------------------------------------------
# Networks
# ------------------------------------------------------------------------------
networks:
  forgecloud-network:
    name: forgecloud-network
    driver: bridge
