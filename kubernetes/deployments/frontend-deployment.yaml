apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: forgecloud-system
  labels:
    app.kubernetes.io/name: frontend
    app.kubernetes.io/instance: forgecloud-frontend
    app.kubernetes.io/part-of: forgecloud
    app.kubernetes.io/component: presentation
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: frontend
        app.kubernetes.io/instance: forgecloud-frontend
        app.kubernetes.io/part-of: forgecloud
        app.kubernetes.io/component: presentation
    spec:
      serviceAccountName: frontend-sa
      containers:
        - name: frontend
          image: 000000000000.dkr.ecr.us-east-1.amazonaws.com/forgecloud-apps:frontend-latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 10
            timeoutSeconds: 3
            successThreshold: 1
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
            successThreshold: 1
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
              add:
                - NET_BIND_SERVICE
