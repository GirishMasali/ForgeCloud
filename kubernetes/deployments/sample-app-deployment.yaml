apiVersion: apps/v1
kind: Deployment
metadata:
  name: sample-backend-service
  namespace: forgecloud-apps
  labels:
    app.kubernetes.io/name: sample-backend-service
    app.kubernetes.io/instance: sample-app
    app.kubernetes.io/part-of: forgecloud-apps
    app.kubernetes.io/component: sample-app
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: sample-backend-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sample-backend-service
        app.kubernetes.io/instance: sample-app
        app.kubernetes.io/part-of: forgecloud-apps
        app.kubernetes.io/component: sample-app
    spec:
      serviceAccountName: sample-app-sa
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: sample-backend-service
          image: 000000000000.dkr.ecr.us-east-1.amazonaws.com/sample-backend-service:v1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          envFrom:
            - configMapRef:
                name: sample-app-config
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            successThreshold: 1
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 3
            successThreshold: 1
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
