apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: sample-backend-service-hpa
  namespace: forgecloud-apps
  labels:
    app.kubernetes.io/name: sample-backend-service-hpa
    app.kubernetes.io/part-of: forgecloud-apps
    app.kubernetes.io/component: autoscaling
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: sample-backend-service
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
