# ==============================================================================
# ForgeCloud Backend Secret Template
# SAFE PLACEHOLDER TEMPLATE: Zero real credentials or production secrets are committed.
# In production, values are injected via external secret stores (AWS Secrets Manager,
# SealedSecrets, or CI/CD deployment pipelines).
# ==============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: backend-secrets
  namespace: forgecloud-system
  labels:
    app.kubernetes.io/name: backend-secrets
    app.kubernetes.io/part-of: forgecloud
    app.kubernetes.io/component: control-plane
type: Opaque
stringData:
  POSTGRES_PASSWORD: "CHANGE_ME_DATABASE_PASSWORD"
  DATABASE_URL: "postgresql://forgecloud_user:CHANGE_ME_DATABASE_PASSWORD@postgres.forgecloud-system.svc.cluster.local:5432/forgecloud_db"
  JWT_SECRET_KEY: "CHANGE_ME_JWT_SECRET_KEY_MINIMUM_32_CHARACTERS_REQUIRED"
